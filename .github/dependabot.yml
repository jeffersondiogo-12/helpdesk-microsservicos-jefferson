version: 2
updates:
  # Cada serviço tem as suas dependências e a sua imagem
  - package-ecosystem: pip
    directories:
      - /usuarios
      - /inventario
      - /chamados
      - /notificacoes
      - /gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /usuarios
      - /inventario
      - /chamados
      - /notificacoes
      - /gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
